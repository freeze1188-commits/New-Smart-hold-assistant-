- name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare source folder
        run: |
          rm -rf generated-src
          mkdir -p generated-src/com/freeze1188/smarthold
          cp MainActivity.java generated-src/com/freeze1188/smarthold/MainActivity.java
          cp HoldMonitorService.java generated-src/com/freeze1188/smarthold/HoldMonitorService.java

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartHold-debug-apk
          path: build/outputs/apk/debug/*.apk
